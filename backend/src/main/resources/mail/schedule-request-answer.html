<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{{statusLabel}}</title>
</head>
<body style="margin:0;padding:0;background-color:#eef4f8;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2d3a;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{{headline}}</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef4f8;">
<tr>
<td align="center" style="padding:32px 16px;">

<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(17,76,116,0.10);">

  <tr>
    <td align="center" style="padding:32px 32px 24px 32px;">
      <img src="cid:classifyLogo" width="180" alt="Classify" style="display:block;width:180px;max-width:180px;height:auto;border:0;">
    </td>
  </tr>

  <tr>
    <td style="height:4px;line-height:4px;font-size:0;background-color:{{statusColor}};">&nbsp;</td>
  </tr>

  <tr>
    <td style="padding:32px 40px 8px 40px;">
      <p style="margin:0 0 6px 0;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:{{statusColor}};">{{statusLabel}}</p>
      <h1 style="margin:0;font-size:22px;line-height:30px;font-weight:700;color:#114c74;">Olá, {{studentName}}!</h1>
      <p style="margin:10px 0 0 0;font-size:15px;line-height:23px;color:#4a5b6b;">{{headline}}</p>
    </td>
  </tr>

  <tr>
    <td style="padding:24px 40px 0 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #dbe8ef;border-radius:12px;">
        <tr>
          <td style="padding:18px 20px;">
            <p style="margin:0;font-size:12px;color:#6b7c8c;">Disciplina</p>
            <p style="margin:2px 0 12px 0;font-size:15px;font-weight:600;color:#1f2d3a;">{{subjectName}} com {{teacherName}}</p>
            <p style="margin:0;font-size:12px;color:#6b7c8c;">Quando</p>
            <p style="margin:2px 0 0 0;font-size:15px;font-weight:600;color:#1f2d3a;">{{when}}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:16px 40px 0 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="border-left:4px solid {{statusColor}};background-color:#f8fbfc;border-radius:0 10px 10px 0;padding:14px 18px;font-size:15px;line-height:23px;color:#1f2d3a;">{{detail}}</td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td align="center" style="padding:32px 40px 8px 40px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="center" bgcolor="#114c74" style="border-radius:10px;background-color:#114c74;">
            <a href="{{appUrl}}" style="display:inline-block;padding:14px 34px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">Abrir o Classify</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:28px 40px 32px 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="border-top:1px solid #e3edf2;padding-top:20px;font-size:12px;line-height:18px;color:#8a9aa8;text-align:center;">
            Mensagem automática do <strong style="color:#114c74;">Classify</strong> sobre a sua solicitação de aula.
          </td>
        </tr>
      </table>
    </td>
  </tr>

</table>

</td>
</tr>
</table>
</body>
</html>
